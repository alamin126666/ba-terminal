name: Build BA TERMINAL APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Locate Android NDK (for proot)
        run: |
          NDK=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK" ]; then echo "No NDK under \$ANDROID_HOME/ndk" >&2; exit 1; fi
          echo "NDK=$NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> $GITHUB_ENV
      - name: Build proot (BA Linux sandbox)
        run: bash scripts/build-proot.sh
      - name: Download Alpine rootfs (BA Linux)
        run: |
          mkdir -p app/src/main/assets/linux
          curl -fsSL -o app/src/main/assets/linux/alpine-aarch64.bin \
            https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/aarch64/alpine-minirootfs-3.24.4-aarch64.tar.gz
          echo "4b14c18f7e90a063b61462ea1462a5732c154bf6adad594974fe6487cd98a8de  app/src/main/assets/linux/alpine-aarch64.bin" | sha256sum -c -
      - name: Test + Lint + Release APK
        run: gradle testDebugUnitTest lint assembleRelease
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ba-terminal-apk
          path: app/build/outputs/apk/release/*.apk
